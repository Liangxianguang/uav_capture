experiment_name: capture_radius_recurrent_behavior_cloning_central_v4_s3_progressive
environment_config: capture_radius_pursuit_central_v4_flee.yaml

# S3 recovery curriculum. The target remains an ordinary evader in every
# stage: central-zone entry and transit are never required for capture.
imitation:
  seed: 661101
  device: cuda
  episodes: 320
  expert_max_attempts_per_episode: 8
  expert_max_rejection_rate: 0.25
  expert_require_safe_capture: true
  expert_require_cooperative_safe_capture: true
  training_obstacle_counts: [3]
  training_target_speed_scales: [0.45, 0.55]
  training_target_motion_modes: [flee_persistence, s_curve]
  training_required_defender_zone_entries: 2
  training_showcase_stages:
    # Recover the reverse-side gap without changing obstacle randomness.
    - until_progress: 0.25
      showcase_probability: 1.0
      randomized_central_probability: 0.0
      layouts: [cylinder, box, wall, cylinder_box, mixed]
      initial_side_distances: [5.5, 6.0]
      defender_sides: [left, right]
      target_speed_scales: [0.45]
      target_motion_modes: [flee_persistence]
      target_crossing_probability: 0.0
      required_defender_zone_entries: 2
    # Add the validation target-speed range and turn behavior on fixed maps.
    - until_progress: 0.50
      showcase_probability: 1.0
      randomized_central_probability: 0.0
      layouts: [cylinder, box, wall, cylinder_box, mixed]
      initial_side_distances: [6.0, 6.5]
      defender_sides: [left, right]
      target_speed_scales: [0.45, 0.55]
      target_motion_modes: [flee_persistence, s_curve]
      target_crossing_probability: 0.0
      required_defender_zone_entries: 2
    # Randomize geometry while retaining the nominal frozen sensing contract.
    - until_progress: 0.75
      showcase_probability: 1.0
      randomized_central_probability: 0.60
      randomized_obstacle_count_range: [3, 4]
      layouts: [mixed]
      initial_side_distances: [6.0, 6.5, 7.0]
      defender_sides: [left, right]
      target_speed_scales: [0.45, 0.55]
      target_motion_modes: [flee_persistence, s_curve]
      target_crossing_probability: 0.0
      required_defender_zone_entries: 2
    # Match the full S3 obstacle count and delayed-noisy observation setting.
    - until_progress: 1.0
      showcase_probability: 1.0
      randomized_central_probability: 0.85
      randomized_obstacle_count_range: [3, 5]
      layouts: [mixed]
      initial_side_distances: [6.0, 6.5, 7.0, 7.5]
      defender_sides: [left, right]
      target_speed_scales: [0.45, 0.55]
      target_motion_modes: [flee_persistence, s_curve]
      target_crossing_probability: 0.0
      required_defender_zone_entries: 2
      pursuit_overrides:
        detection_range: 14.0
        detection_dropout_probability: 0.22
        observation_noise_std: 0.06
        message_delay_steps: 4
        message_dropout_probability: 0.10
  learning_rate: 0.0003
  action_scale_mode: full_range
  hidden_dim: 128
  epochs: 96
  validation_episodes: 10
