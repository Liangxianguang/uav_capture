protocol_name: jepa_safe_capture_system_v2
protocol_version: 2
phase: development_only
locked_test_opened: false
not_a_replacement_for_existing_locked_benchmarks: true

objective:
  task: 3d_multi_uav_adversarial_encirclement
  world_model_role: candidate_trajectory_evaluator_only
  primary_endpoint: safe_capture
  secondary_endpoints:
    - collision_free_execution
    - boundary_safe_execution
    - pairwise_separation
    - transit_success
  capture_time_is_rejection_gate: false
  absolute_safe_capture_threshold_required: false

frozen_inputs:
  actor_checkpoint: models/v5_development_exact_reactive_seed661606.pt
  environment_config: configs/capture_radius_pursuit_central_v4_flee.yaml
  scenario_protocol: configs/central_random_mixed_obstacle_s3_v5_protocol.yaml
  reference_scenes: results/jepa_v2_control_baseline60/scenes.jsonl
  reference_episodes: results/jepa_v2_control_baseline60/episodes.csv

world:
  backend: kinematic
  dt_seconds: 0.1
  max_steps: 250
  half_extent_xy_m: 10.0
  minimum_altitude_m: 0.5
  height_m: 10.0

agent_contract:
  defender_count: 4
  vehicle_radius_m: 0.25
  defender_max_speed_mps: 5.0
  defender_max_acceleration_mps2: 6.0
  target_max_speed_mps: 3.6
  target_max_acceleration_mps2: 4.0
  observation_dimension: 63
  action_dimension: 3
  history_length_steps: 8

candidate_contract:
  count: 5
  perturbation_mps: 0.10
  allowed_chunk_lengths_steps: [1, 3, 5]
  selected_chunk_length_steps: 3
  semantics: constant_desired_action_chunk_execute_first_step_then_replan
  candidate_must_be_dynamics_feasible: true
  jepa_can_generate_final_action: false
  execute_only_first_step_then_reobserve: true
  nominal_anchor_required: true

jepa_contract:
  model_type: interaction_aware_action_conditioned_jepa_multitask
  role: evaluator_and_ranker_before_cbf
  prediction_horizons_steps: [1, 2, 3, 5]
  prediction_tasks:
    - target_relative_displacement
    - target_velocity_acceleration
    - obstacle_clearance_lower_quantile
    - inter_agent_clearance_lower_quantile
    - pairwise_time_to_collision
    - target_visibility
    - observation_age
    - cbf_intervention_probability
    - cbf_correction_magnitude
    - cbf_qp_feasibility
  uses_online_target_truth: false
  updates_actor_online: false
  updates_ledger_online: false
  uncertainty_is_not_a_safety_certificate: true

reliability_ledger:
  version: 2
  enabled: true
  source_split: calibration_only
  update_rule: offline_settled_outcomes_only
  immutable_after_calibration: true
  checkpoint_hash_bound: true
  states: [trusted, fallback_nominal, safe_hold]
  minimum_sample_count: 128
  minimum_credit: 0.65
  required_bucket_fields:
    - visibility_condition
    - observation_age_bucket
    - obstacle_count
    - layout_signature
    - target_motion_mode
    - target_speed_scale
    - minimum_clearance_bucket
    - pairwise_time_to_collision_bucket
    - uncertainty_bucket
    - cbf_intervention_risk_bucket
  low_credit_action: frozen_v5_nominal_then_cbf
  ood_action: safe_hold_then_nominal_cbf

cbf_contract:
  enabled_for_baseline_and_candidate: true
  final_safety_filter: true
  discrete_time: true
  gamma: 0.25
  obstacle_surface_margin_m: 0.35
  inter_agent_surface_margin_m: 0.15
  boundary_surface_margin_m: 0.35
  target_surface_margin_m: 0.0
  constraints:
    - obstacle_separation
    - inter_agent_separation
    - world_boundary
    - altitude
    - speed
    - acceleration
    - target_capture_approach
  qp_infeasible_action: safe_hold_then_nominal_cbf
  stale_observation_action: fallback_nominal_then_cbf
  max_correction_norm_mps: 5.0
  minimum_constraint_tolerance: -0.00001
  log_active_constraints: true
  log_solver_status: true

rolling_horizon:
  control_period_seconds: 0.1
  execute_steps_per_replan: 1
  reobserve_after_execution: true
  maximum_prediction_age_steps: 3
  timeout_action: safe_hold

evaluation:
  training_seeds: [20260911, 20260912, 20260913]
  smoke_episodes_per_seed: 20
  final_episodes_per_seed: 60
  primary_pairing_unit: training_seed_episode
  primary_metrics:
    - safe_capture
    - collision
    - boundary_violation
    - pairwise_min_clearance
    - cbf_qp_infeasible
  secondary_metrics:
    - transit_success
    - capture_time_seconds
    - total_defender_path_length_m
    - cbf_correction_norm
    - candidate_switch_rate
    - inference_latency_ms
  safety_stop_rules:
    new_collision: true
    new_boundary_violation: true
    zero_perturbation_regression: true
    non_finite_output: true
    unpaired_episode: true

decision_gates:
  safety_hard_gate:
    candidate_collision_count_max: 0
    candidate_boundary_violation_count_max: 0
    zero_perturbation_non_jepa_field_differences_max: 0
  safe_capture_noninferiority:
    mean_paired_delta_percentage_points_min: 0.0
    per_seed_delta_percentage_points_min: -1.6666667
    nonnegative_seed_count_min: 2
  positive_claim:
    mean_paired_delta_percentage_points_strictly_positive: true
    nonnegative_seed_count_min: 2
    report_bootstrap_and_mcnemar: true
  reliability_gate:
    high_credit_failure_rate_not_above_low_credit: true
    ood_must_trigger_fallback: true
  realtime_gate:
    p95_total_control_latency_ms_max: 100.0

training:
  device: cuda
  epochs: 40
  batch_size: 512
  learning_rate: 0.001
  weight_decay: 0.00001
  replay_enabled: false
  tensorboard:
    required: true
    root: results/jepa_safe_capture_v2_tensorboard
    log_config_text: true
    log_provenance_text: true
    log_histograms: true
    required_scalar_prefixes:
      - Loss/
      - Target/
      - Clearance/
      - InterAgent/
      - Visibility/
      - Risk/
      - Calibration/
      - Reliability/
      - CBF/
      - Latency/
      - Optimization/
    required_text_artifacts:
      - protocol
      - model_config
      - train_metadata
      - validation_metadata
      - calibration_metadata
      - source_hashes

provenance:
  output_manifest: results/jepa_safe_capture_v2_protocol_audit.json
  require_git_commit_per_phase: true
  require_remote_push_per_phase: true
  results_are_not_locked_evidence: true
