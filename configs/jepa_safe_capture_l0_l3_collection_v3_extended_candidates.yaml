protocol_name: jepa_safe_capture_l0_l3_collection_v3_extended_candidates
protocol_version: 1
phase: development_only
locked_test_opened: false
not_a_replacement_for_existing_locked_benchmarks: true

# This protocol is disjoint from the legacy L0-L3 results.  It freezes the
# extended candidate profile before any development rollout.
seed_blocks:
  train: 28100101
  validation: 28200101
  calibration: 28300101
  development: 28400101
  locked: 28500101

world:
  half_extent_xy: 10.0
  height: 10.0
  minimum_altitude: 0.5
  dt: 0.1
  max_steps: 250

agents:
  defenders: 4
  defender_max_speed: 5.0
  defender_max_acceleration: 6.0
  target_max_speed: 3.6
  target_max_acceleration: 4.0
  drone_radius: 0.25

dynamics:
  backend: kinematic

task:
  pursuit:
    capture_radius: 0.80
    maximum_message_age_steps: 60
    obstacle_profile: mixed

# The scene curriculum is held constant across variants and training seeds.
experiments:
  - name: l0_open_nominal
    episodes: 24
    difficulty: l0_open
    obstacle_count: 0
    target_speed_scale: 0.45
    pursuit_overrides:
      target_motion_mode: flee_persistence
      detection_dropout_probability: 0.0
      observation_noise_std: 0.0
      message_delay_steps: 0
      message_dropout_probability: 0.0

  - name: l0_single_obstacle_nominal
    episodes: 24
    difficulty: l0_single_obstacle
    obstacle_count: 1
    target_speed_scale: 0.45
    pursuit_overrides:
      target_motion_mode: flee_persistence
      detection_dropout_probability: 0.0
      observation_noise_std: 0.0
      message_delay_steps: 0
      message_dropout_probability: 0.0

  - name: l1_three_obstacle_flee
    episodes: 32
    difficulty: l1_nominal
    obstacle_count: 3
    target_speed_scale: 0.45
    pursuit_overrides:
      target_motion_mode: flee_persistence
      detection_dropout_probability: 0.0
      observation_noise_std: 0.0
      message_delay_steps: 0
      message_dropout_probability: 0.0

  - name: l1_three_obstacle_s_curve
    episodes: 32
    difficulty: l1_s_curve
    obstacle_count: 3
    target_speed_scale: 0.45
    pursuit_overrides:
      target_motion_mode: s_curve
      detection_dropout_probability: 0.0
      observation_noise_std: 0.0
      message_delay_steps: 0
      message_dropout_probability: 0.0

  - name: l2_three_obstacle_dropout
    episodes: 32
    difficulty: l2_partial_observation
    obstacle_count: 3
    target_speed_scale: 0.50
    pursuit_overrides:
      target_motion_mode: flee_persistence
      detection_dropout_probability: 0.15
      observation_noise_std: 0.03
      message_delay_steps: 2
      message_dropout_probability: 0.05
      observation_delay_steps: 1

  - name: l2_three_obstacle_delayed_s_curve
    episodes: 32
    difficulty: l2_delayed_noisy
    obstacle_count: 3
    target_speed_scale: 0.50
    pursuit_overrides:
      target_motion_mode: s_curve
      detection_dropout_probability: 0.22
      observation_noise_std: 0.06
      message_delay_steps: 4
      message_dropout_probability: 0.10
      observation_delay_steps: 2

  - name: l3_four_obstacle_mixed
    episodes: 32
    difficulty: l3_mixed_obstacle
    obstacle_count: 4
    target_speed_scale: 0.55
    pursuit_overrides:
      target_motion_mode: flee_persistence
      detection_dropout_probability: 0.15
      observation_noise_std: 0.03
      message_delay_steps: 2
      message_dropout_probability: 0.05

  - name: l3_five_obstacle_delayed_s_curve
    episodes: 32
    difficulty: l3_s3_stress
    obstacle_count: 5
    target_speed_scale: 0.55
    pursuit_overrides:
      target_motion_mode: s_curve
      detection_dropout_probability: 0.22
      observation_noise_std: 0.06
      message_delay_steps: 4
      message_dropout_probability: 0.10
      observation_delay_steps: 2

archive_contract:
  dataset_version: jepa_safe_capture_l0_l3_v3_extended_candidates
  allowed_splits: [train, validation, calibration, development]
  history_length: 8
  horizon_steps: [1, 2, 3, 5]
  candidate_profile: extended_v1
  candidate_count: 12
  candidate_cbf_prefilter: true
  perturbation_mps: 0.10
  chunk_length_steps: 3
  candidate_semantics: constant_desired_action_chunk_execute_first_step_then_replan
  target_truth_used_only_for_offline_labels: true
  split_overlap_forbidden: true
  locked_test_collection_forbidden: true
  safety_contract:
    cbf_margin_changed: false
    stale_ood_nonfinite_gates_changed: false
    controlled_abort_preserved: true
    raw_unverified_execution_allowed: false
