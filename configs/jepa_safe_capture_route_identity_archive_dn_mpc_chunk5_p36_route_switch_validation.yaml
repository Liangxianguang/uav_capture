protocol_name: jepa_safe_capture_route_identity_archive_dn_mpc_chunk5_p36_route_switch_validation
protocol_version: 1
phase: development_only
locked_test_opened: false
not_a_locked_test: true

source_protocol: configs/central_random_mixed_obstacle_s3_route_v1_p17_validation_protocol.yaml
environment_config: configs/capture_radius_pursuit_central_v4_flee.yaml
split: validation
calibration_split: calibration

data_contract:
  dataset_version: dn_mpc_route_identity_chunk5_p36_route_switch_v1
  history_length: 8
  horizon_steps: [1, 2, 3, 5]
  chunk_length_steps: 5
  candidate_profile: obstacle_route_v1
  candidate_count: 12
  candidate_semantics: geometry_conditioned_route_chunk_execute_first_step_then_replan
  action_history_alignment: past_executed_actions_then_route_first_action
  target_truth_used_only_for_offline_labels: true
  split_overlap_forbidden: true
  locked_test_collection_forbidden: true
  route_execution_identity:
    enabled: true
    fields: [previous_executed_route_index, executed_route_index, route_switch_outcome, route_match_residual_mps]
    match_tolerance_mps: 1.0
    measured_between_sampled_route_decisions: true
  target_escape_label:
    enabled: true
    field: labels_target_escape_cost
    definition: norm_of_offline_post_action_target_relative_vector_per_horizon_step

state_distribution:
  mode: frozen_runtime_actor
  actor_checkpoint_required: true

safety_contract:
  cbf_margin_changed: false
  stale_ood_nonfinite_gates_changed: false
  controlled_abort_preserved: true
  raw_unverified_execution_allowed: false
  branch_advances_only_after_verified_primary_cbf: true
  route_identity_match_is_observational_only: true

cbf_contract:
  anticipatory_horizon_steps: 5
  barrier_mode: strict_buffer
  margin_source: configs/capture_radius_pursuit_central_v4_flee.yaml

tensorboard:
  required: true
  scalar_groups:
    - Archive/sample_count
    - Archive/runtime_sample_count
    - Archive/cbf_first_step_feasible_fraction
    - RouteIdentity/matched_fraction
    - RouteIdentity/switch_fraction
    - RouteIdentity/match_residual_p95_mps
