experiment_name: capture_radius_recurrent_mappo_showcase_curriculum_pilot
environment_config: capture_radius_pursuit_showcase_mixed_curriculum.yaml
training:
  seed: 640101
  device: cuda
  total_steps: 32768
  rollout_steps: 1024
  epochs: 4
  minibatch_size: 8
  learning_rate: 0.0001
  evaluation_episodes: 10
  evaluation_interval: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  value_coefficient: 0.5
  entropy_coefficient: 0.003
  max_gradient_norm: 0.5
  hidden_dim: 128
  torch_num_threads: 1
  deterministic_algorithms: true
  training_obstacle_counts: [0, 3, 5]
  training_target_speed_scales: [0.45, 0.55]
  training_showcase_stages:
    - until_progress: 0.25
      showcase_probability: 0.35
      layouts: [open, cylinder]
      initial_side_distances: [4.0]
      defender_sides: [left]
      target_speed_scales: [0.45]
    - until_progress: 0.60
      showcase_probability: 0.55
      layouts: [cylinder, cylinder_box]
      initial_side_distances: [4.0, 4.5]
      defender_sides: [left]
      target_speed_scales: [0.45, 0.55]
    - until_progress: 1.0
      showcase_probability: 0.70
      layouts: [cylinder_box, mixed]
      initial_side_distances: [4.5, 5.0]
      defender_sides: [left, right]
      target_speed_scales: [0.45, 0.55]
  warm_start_log_std: -2.2
  evaluation_use_cbf: true
