protocol_name: central_random_mixed_obstacle_s3_v5_robust_capture
phase: F0_frozen_development_protocol
task: partially_observable_3d_capture_radius_random_central_mixed_obstacles
not_a_replacement_for_existing_locked_benchmarks: true
