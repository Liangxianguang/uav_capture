protocol_name: jepa_safe_capture_route_identity_archive_pairwise_tail_calibration_v1
protocol_version: 1
phase: development_only
locked_test_opened: false

source_protocol: configs/central_random_mixed_obstacle_s3_route_v2_pairwise_tail_calibration_development_protocol.yaml
environment_config: configs/capture_radius_pursuit_central_v4_flee.yaml
split: calibration
calibration_split: calibration
episodes_smoke: 4
sample_stride: 8

state_distribution:
  mode: frozen_runtime_actor
  actor_checkpoint_required: true
  actor_recurrent_reset_interval_from_checkpoint: true
  rule_controller_fallback_for_actor_archive: false

data_contract:
  dataset_version: jepa_safe_capture_route_identity_hard_negative_v2
  history_length: 8
  horizon_steps: [1, 2, 3, 5]
  chunk_length_steps: 3
  candidate_profile: obstacle_route_v1
  candidate_count: 12
  candidate_semantics: geometry_conditioned_route_chunk_execute_first_step_then_replan
  action_history_alignment: past_executed_actions_then_route_first_action
  target_truth_used_only_for_offline_labels: true
  split_overlap_forbidden: true
  locked_test_collection_forbidden: true

labels:
  required:
    - target_relative
    - obstacle_clearance
    - boundary_clearance
    - inter_agent_clearance
    - stopping_distance
    - obstacle_ttc
    - boundary_ttc
    - pairwise_ttc
    - acceleration_slack
    - target_visibility
    - cbf_correction
    - cbf_intervention
    - cbf_feasible
    - cbf_min_slack
    - route_progress
    - route_identity
    - route_side
    - earliest_failure_step
  negative_examples_required:
    - cbf_feasible
    - boundary_clearance
    - obstacle_ttc
    - pairwise_ttc
    - acceleration_slack
    - route_geometry_valid

safety_contract:
  cbf_margin_changed: false
  stale_ood_nonfinite_gates_changed: false
  controlled_abort_preserved: true
  raw_unverified_execution_allowed: false
  branch_advances_only_after_verified_primary_cbf: true

cbf_contract:
  anticipatory_horizon_steps: 5
  barrier_mode: strict_buffer
  margin_source: configs/capture_radius_pursuit_central_v4_flee.yaml

tensorboard:
  required: true
  scalar_groups:
    - Archive/sample_count
    - Archive/route_geometry_valid_fraction
    - Archive/cbf_first_step_feasible_fraction
    - Archive/branch_failure_within_horizon_fraction
    - Archive/negative_pairwise_ttc_fraction
  text_artifacts:
    - dataset_version
    - protocol_sha256
    - dataset_sha256
    - information_boundary
