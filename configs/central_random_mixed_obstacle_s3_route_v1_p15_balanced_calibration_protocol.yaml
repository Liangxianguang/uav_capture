protocol_name: central_random_mixed_obstacle_s3_route_v1_p15_balanced_calibration
protocol_version: 1
phase: development_only
locked_test_opened: false
not_a_locked_test: true

seed_blocks:
  train: 658101
  validation: 659101
  calibration: 657101
  development: 660101
  locked_test: 647201

episodes_per_split:
  train: 40
  validation: 40
  calibration: 20
  development: 20
  locked_test: 100

s3:
  target_crossing_required: false
  required_defender_zone_entries: 2
  obstacle_count_range: [3, 5]
  initial_side_distances: [6.0, 6.5, 7.0, 7.5, 9.0]
  defender_sides: [left, right]
  target_speed_scales: [0.45, 0.55]
  target_crossing_speed_scales: [0.90]
  target_motion_modes: [flee_persistence, s_curve]
  observation_conditions:
    - name: nominal
      pursuit_overrides:
        detection_range: 14.0
        detection_dropout_probability: 0.15
        observation_noise_std: 0.03
        message_delay_steps: 2
        message_dropout_probability: 0.05
    - name: delayed_noisy
      pursuit_overrides:
        detection_range: 14.0
        detection_dropout_probability: 0.22
        observation_noise_std: 0.06
        message_delay_steps: 4
        message_dropout_probability: 0.10
  max_sampling_attempts: 500

route_contract:
  candidate_profile: obstacle_route_v1
  candidate_count: 12
  chunk_length_steps: 5
  execute_only_first_step: true
  project_to_reachable_dynamics: true
  primary_cbf_prefilter: true
  interaction_hard_negatives:
    enabled: true
    modes: [near_pass, formation_crossing, split_merge]
    offline_only: true

safety_contract:
  cbf_margin_changed: false
  stale_ood_nonfinite_gates_changed: false
  controlled_abort_preserved: true
  raw_unverified_execution_allowed: false
  branch_advances_only_after_verified_primary_cbf: true

cbf_contract:
  anticipatory_horizon_steps: 5
  barrier_mode: strict_buffer
  margin_source: configs/capture_radius_pursuit_central_v4_flee.yaml

calibration_contract:
  purpose: balanced_pairwise_outcome_calibration
  source_archives_disjoint_from: [p13, p14]
  requires_runtime_branch_failures: true
  requires_offline_pairwise_interaction_probes: true
  never_open_locked_test: true

tensorboard:
  required: true
  archive_scalars:
    - Archive/sample_count
    - Archive/runtime_sample_count
    - Archive/cbf_first_step_feasible_fraction
    - Archive/branch_failure_within_horizon_fraction
    - Archive/interaction_hard_negative_samples/near_pass
    - Archive/interaction_hard_negative_samples/formation_crossing
    - Archive/interaction_hard_negative_samples/split_merge
