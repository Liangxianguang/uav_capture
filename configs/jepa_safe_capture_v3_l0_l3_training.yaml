protocol_name: jepa_safe_capture_system_v3_l0_l3_hard_replay_training
protocol: configs/jepa_safe_capture_v3_next_phase.yaml
model_type: interaction_aware_action_conditioned_jepa_safe_capture_v2
training_variant: hard_context_weighted_v1
phase: development_only
locked_test_opened: false

# The L0-L3 archive is train-only. Validation and calibration remain disjoint
# and are never sampled by the replay sampler.
data:
  train_dataset: results/jepa_safe_capture_l0_l3_v1_train_merged/counterfactual_safe_capture_v2.npz
  train_metadata: results/jepa_safe_capture_l0_l3_v1_train_merged/metadata.json
  validation_dataset: results/jepa_safe_capture_l0_l3_v2_validation/counterfactual_safe_capture_v2.npz
  validation_metadata: results/jepa_safe_capture_l0_l3_v2_validation/metadata.json
  calibration_metadata: results/jepa_safe_capture_l0_l3_v2_calibration/metadata.json

seeds: [20260911, 20260912, 20260913]
model:
  input_dim: 63
  action_dim: 3
  hidden_dim: 128
  latent_dim: 64
  num_layers: 1
  interaction_group_slices: [[0, 15], [15, 33], [33, 48], [48, 63]]

training:
  epochs: 40
  batch_size: 1024
  learning_rate: 0.001
  weight_decay: 0.00001
  quantile: 0.10
  hard_weight_cap: 8.0
  replay_uniform_fraction: 0.50
  task_loss_weights:
    latent: 1.00
    clearance: 0.50
    visibility: 0.25
    cbf_correction: 0.25
    cbf_intervention: 0.25
    velocity: 0.50
    acceleration: 0.35
    quantile: 0.50
    ttc: 0.25
    observation_age: 0.20
    qp_feasibility: 0.35
    action_consistency: 0.25
  histogram_interval: 5

tensorboard:
  root: results/jepa_safe_capture_v3_l0_l3_tensorboard
  required: true
  log_config_text: true
  log_provenance_text: true
  log_histograms: true
